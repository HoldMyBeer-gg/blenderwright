[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blend-ai"
version = "1.3.2"
description = "The most intuitive and efficient MCP Server for Blender"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "mcp>=1.26.0,<2",
    "pydantic>=2.0",
]

[project.scripts]
blend-ai = "blend_ai.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blend_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[project.optional-dependencies]
# blend_ai.ollama_chat drives Blender from a local Ollama model. The import is
# optional so the MCP server itself stays dependency-light.
chat = [
    "ollama>=0.4",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.15,<0.16",
]

# uv installs this group by default, so `uv run pytest` uses the project's own
# pytest. Without it, pytest is only in the optional dev extra, uv does not
# install it, and the command silently falls through to whatever pytest is on
# PATH. That interpreter had mcp 2.x, where FastMCP was renamed, so every test
# importing blend_ai.server errored and the failures looked unexplained.
# The extra above stays for CI, which installs with pip.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.15,<0.16",
]
