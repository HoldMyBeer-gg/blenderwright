name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-extension:
    name: Build extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 5.2 LTS
        run: |
          curl -sSfL -o blender.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz
          echo "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec  blender.tar.xz" \
            | sha256sum -c -
          mkdir -p blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "$PWD/blender" >> "$GITHUB_PATH"

      - name: Validate manifest
        run: blender --command extension validate addon/

      - name: Build extension zip
        run: |
          mkdir -p dist
          blender --command extension build --source-dir addon --output-dir dist
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blenderwright-extension
          path: dist/blenderwright-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/blenderwright-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Refuse to publish a version that does not match the tag
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "pyproject version ${version} does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build sdist and wheel
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
