name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: Upgrade build tooling
        # The runner image ships its own setuptools/pip. pip-audit reports
        # vulnerabilities in those even though this project does not depend
        # on them (the build backend is hatchling), so keep them current
        # rather than let runner drift fail the build.
        run: pip install --upgrade pip setuptools wheel
      - name: bandit
        run: bandit -r src/ -ll  # low severity threshold; skip install_addon.py (subprocess by design)
      - name: Install project dependencies
        run: pip install -e ".[dev,installer]"
      - name: pip-audit
        # Audits the environment, which now contains this project's declared
        # dependencies. The upgrade step above keeps the runner's own build
        # tooling current so drift in the image does not fail the build.
        run: pip-audit

  tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,installer]"
      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_addon

  coverage:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,installer]"
      - name: Run tests with coverage
        run: pytest tests/ --cov=src/blend_ai --cov-report=term-missing --ignore=tests/test_addon
